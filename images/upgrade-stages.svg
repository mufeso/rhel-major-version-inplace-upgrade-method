<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1125 625" width="1125" height="625" font-family="'Red Hat Text','Segoe UI','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">RHEL major-version in-place upgrade: stages</title>
  <desc id="d">Eight stages with a gate between each: pre-flight validation before the change window; then recovery points (a full platform copy plus an LVM snapshot), Leapp pre-upgrade with remediation, upgrade and reboots, patching, validation of required tools and agents, security hardening, and completion and handoff inside the window. Rarely, after testing on the new version, the application owners decide to roll back; a separate, fully automated run then restores the recovery points, for many servers in parallel.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d4d4d"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a30000"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.12"/></filter>
    <style>
      .card{fill:#fff;stroke:#d2d2d2;stroke-width:1}
      .num{font-size:13px;font-weight:700;fill:#fff}
      .ttl{font-size:16px;font-weight:700;fill:#151515}
      .sub{font-size:12.5px;fill:#4d4d4d}
      .band{font-size:12px;font-weight:700;letter-spacing:1.2px}
      .ic{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1125" height="625" fill="#f8f8f8"/>
  <rect x="20" y="20" width="225" height="448" rx="10" fill="#e7f1fa"/>
  <text x="132" y="44" text-anchor="middle" class="band" fill="#0066cc">BEFORE THE WINDOW</text>
  <rect x="265" y="20" width="842" height="448" rx="10" fill="#fdf0e6"/>
  <text x="686" y="44" text-anchor="middle" class="band" fill="#c46100">INSIDE THE CHANGE WINDOW</text>
  <g filter="url(#sh)"><rect class="card" x="40" y="62" width="180" height="172" rx="8"/></g>
  <rect x="40" y="62" width="180" height="6" rx="3" fill="#0066cc"/>
  <circle cx="64" cy="92" r="13" fill="#0066cc"/><text x="64" y="96.5" text-anchor="middle" class="num">1</text>
  <g class="ic" stroke="#0066cc" transform="translate(172,74)"><circle cx="14" cy="14" r="10"/><line x1="21" y1="21" x2="31" y2="31"/><polyline points="9,14 13,18 19,10"/></g>
  <text x="54" y="136" class="ttl">Pre-flight</text>
  <text x="54" y="158" class="sub">Read-only checks, days</text>
  <text x="54" y="175" class="sub">or weeks ahead. No</text>
  <text x="54" y="192" class="sub">change to the server.</text>
  <g filter="url(#sh)"><rect class="card" x="285" y="62" width="180" height="172" rx="8"/></g>
  <rect x="285" y="62" width="180" height="6" rx="3" fill="#5e40be"/>
  <circle cx="309" cy="92" r="13" fill="#5e40be"/><text x="309" y="96.5" text-anchor="middle" class="num">2</text>
  <g class="ic" stroke="#5e40be" transform="translate(417,74)"><ellipse cx="16" cy="7" rx="13" ry="5"/><path d="M3,7 v18 c0,3 6,5 13,5 s13,-2 13,-5 v-18"/><path d="M3,16 c0,3 6,5 13,5 s13,-2 13,-5"/></g>
  <text x="299" y="136" class="ttl">Recovery points</text>
  <text x="299" y="158" class="sub">Full platform copy (AMI,</text>
  <text x="299" y="175" class="sub">VM snapshot or ReaR)</text>
  <text x="299" y="192" class="sub">plus an LVM snapshot.</text>
  <g filter="url(#sh)"><rect class="card" x="495" y="62" width="180" height="172" rx="8"/></g>
  <rect x="495" y="62" width="180" height="6" rx="3" fill="#c46100"/>
  <circle cx="519" cy="92" r="13" fill="#c46100"/><text x="519" y="96.5" text-anchor="middle" class="num">3</text>
  <g class="ic" stroke="#c46100" transform="translate(627,74)"><rect x="3" y="2" width="22" height="28" rx="2"/><line x1="8" y1="10" x2="20" y2="10"/><line x1="8" y1="16" x2="20" y2="16"/><line x1="8" y1="22" x2="15" y2="22"/></g>
  <text x="509" y="136" class="ttl">Pre-upgrade</text>
  <text x="509" y="158" class="sub">Leapp report read; each</text>
  <text x="509" y="175" class="sub">blocker fixed; re-run</text>
  <text x="509" y="192" class="sub">until clean.</text>
  <g filter="url(#sh)"><rect class="card" x="705" y="62" width="180" height="172" rx="8"/></g>
  <rect x="705" y="62" width="180" height="6" rx="3" fill="#a30000"/>
  <circle cx="729" cy="92" r="13" fill="#a30000"/><text x="729" y="96.5" text-anchor="middle" class="num">4</text>
  <g class="ic" stroke="#a30000" transform="translate(837,74)"><circle cx="15" cy="15" r="13"/><polyline points="9,15 15,9 21,15"/><line x1="15" y1="9" x2="15" y2="22"/></g>
  <text x="719" y="136" class="ttl">Upgrade</text>
  <text x="719" y="158" class="sub">Leapp upgrade; every</text>
  <text x="719" y="175" class="sub">reboot driven and</text>
  <text x="719" y="192" class="sub">health-checked.</text>
  <g filter="url(#sh)"><rect class="card" x="915" y="62" width="180" height="172" rx="8"/></g>
  <rect x="915" y="62" width="180" height="6" rx="3" fill="#0066cc"/>
  <circle cx="939" cy="92" r="13" fill="#0066cc"/><text x="939" y="96.5" text-anchor="middle" class="num">5</text>
  <g class="ic" stroke="#0066cc" transform="translate(1047,74)"><path d="M3,10 l13,-7 l13,7 v14 l-13,7 l-13,-7 z"/><polyline points="10,16 15,21 22,13"/></g>
  <text x="929" y="136" class="ttl">Patching</text>
  <text x="929" y="158" class="sub">Same baseline as peer</text>
  <text x="929" y="175" class="sub">servers, e.g. through</text>
  <text x="929" y="192" class="sub">Red Hat Satellite.</text>
  <g filter="url(#sh)"><rect class="card" x="495" y="276" width="180" height="172" rx="8"/></g>
  <rect x="495" y="276" width="180" height="6" rx="3" fill="#0066cc"/>
  <circle cx="519" cy="306" r="13" fill="#0066cc"/><text x="519" y="310.5" text-anchor="middle" class="num">6</text>
  <g class="ic" stroke="#0066cc" transform="translate(627,288)"><rect x="3" y="2" width="24" height="28" rx="2"/><polyline points="7,10 9,12 13,8"/><line x1="16" y1="10" x2="23" y2="10"/><polyline points="7,19 9,21 13,17"/><line x1="16" y1="19" x2="23" y2="19"/></g>
  <text x="509" y="350" class="ttl">Validation</text>
  <text x="509" y="372" class="sub">Required tools and</text>
  <text x="509" y="389" class="sub">agents checked and</text>
  <text x="509" y="406" class="sub">reinstalled if needed.</text>
  <g filter="url(#sh)"><rect class="card" x="705" y="276" width="180" height="172" rx="8"/></g>
  <rect x="705" y="276" width="180" height="6" rx="3" fill="#5e40be"/>
  <circle cx="729" cy="306" r="13" fill="#5e40be"/><text x="729" y="310.5" text-anchor="middle" class="num">7</text>
  <g class="ic" stroke="#5e40be" transform="translate(837,288)"><path d="M15,2 l12,5 v9 c0,8 -6,13 -12,15 c-6,-2 -12,-7 -12,-15 v-9 z"/><polyline points="9,16 14,21 21,12"/></g>
  <text x="719" y="350" class="ttl">Hardening</text>
  <text x="719" y="372" class="sub">CIS with OpenSCAP; fix</text>
  <text x="719" y="389" class="sub">what remains, re-scan</text>
  <text x="719" y="406" class="sub">until clean.</text>
  <g filter="url(#sh)"><rect class="card" x="915" y="276" width="180" height="172" rx="8"/></g>
  <rect x="915" y="276" width="180" height="6" rx="3" fill="#3e8635"/>
  <circle cx="939" cy="306" r="13" fill="#3e8635"/><text x="939" y="310.5" text-anchor="middle" class="num">8</text>
  <g class="ic" stroke="#3e8635" transform="translate(1047,288)"><line x1="5" y1="3" x2="5" y2="31"/><path d="M5,4 h20 l-5,7 l5,7 h-20"/></g>
  <text x="929" y="350" class="ttl">Handoff</text>
  <text x="929" y="372" class="sub">Team notified; status</text>
  <text x="929" y="389" class="sub">published for the</text>
  <text x="929" y="406" class="sub">application teams.</text>
  <g filter="url(#sh)"><rect x="285" y="276" width="180" height="172" rx="8" fill="#fff" stroke="#a30000" stroke-width="1.5" stroke-dasharray="6 4"/></g>
  <g class="ic" stroke="#a30000" transform="translate(299,288)"><path d="M26,8 a12,12 0 1 0 3,10"/><polyline points="27,1 27,9 19,9"/></g>
  <text x="337" y="310" class="ttl" fill="#a30000">Rollback</text><text x="419.6575" y="310" class="sub" fill="#a30000" font-style="italic">(rare)</text>
  <text x="299" y="336" class="sub">Only if app owners find</text>
  <text x="299" y="352" class="sub">their software is not yet</text>
  <text x="299" y="368" class="sub">supported. Automated,</text>
  <text x="299" y="384" class="sub">in parallel: OS-only</text>
  <text x="299" y="400" class="sub">rollback from LVM, or</text>
  <text x="299" y="416" class="sub">whole-server rollback at</text>
  <text x="299" y="432" class="sub">the platform level.</text>
  <g stroke="#4d4d4d" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M220,148.0 H282"/>
    <path d="M465,148.0 H492"/>
    <path d="M675,148.0 H702"/>
    <path d="M885,148.0 H912"/>
    <path d="M1005.0,234 V255.0 H585.0 V273"/>
    <path d="M675,362.0 H702"/>
    <path d="M885,362.0 H912"/>
  </g>
  <g fill="#3e8635">
    <rect x="245.5" y="141.0" width="14" height="14" transform="rotate(45 252.5 148.0)"/>
    <rect x="475.0" y="143.0" width="10" height="10" transform="rotate(45 480.0 148.0)"/>
    <rect x="685.0" y="143.0" width="10" height="10" transform="rotate(45 690.0 148.0)"/>
    <rect x="895.0" y="143.0" width="10" height="10" transform="rotate(45 900.0 148.0)"/>
    <rect x="790.0" y="250.0" width="10" height="10" transform="rotate(45 795.0 255.0)"/>
    <rect x="685.0" y="357.0" width="10" height="10" transform="rotate(45 690.0 362.0)"/>
    <rect x="895.0" y="357.0" width="10" height="10" transform="rotate(45 900.0 362.0)"/>
  </g>
  <path d="M375.0,234 V272" stroke="#a30000" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrR)"/>
  <g transform="translate(20,488)">
    <rect width="1085" height="110" rx="10" fill="#fff" stroke="#e0e0e0"/>
    <rect x="22" y="28" width="14" height="14" transform="rotate(45 29 35)" fill="#3e8635"/>
    <text x="48" y="40" class="sub" fill="#151515"><tspan font-weight="700">Gate</tspan>: a server moves on only when the stage finished cleanly; otherwise the run stops and reports why.</text>
    <line x1="18" y1="74" x2="40" y2="74" stroke="#a30000" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="48" y="78" class="sub" fill="#151515"><tspan font-weight="700">Rollback</tspan> (rare): decided by the application owners after testing on the new version; run by automation from the stage 2 recovery points.</text>
  </g>
</svg>
